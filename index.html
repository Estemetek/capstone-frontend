<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ionic App</title>

    <!-- Allow ngrok HTTPS images & QR codes to load inside emulator -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self' data: blob: filesystem: http: https:;
        img-src 'self' data: blob: filesystem: http: https: https://*.ngrok-free.dev https://*.supabase.co https://res.cloudinary.com https://upload.wikimedia.org http://localhost:3000 http://192.168.*:*;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' http: https:;
        style-src 'self' 'unsafe-inline' http: https:;
        connect-src 'self' http: https: https://*.ngrok-free.dev https://*.supabase.co https://res.cloudinary.com http://localhost:3000 http://192.168.*:*;
        font-src 'self' data: http: https:;
        media-src *;
        frame-src *;
      "
    />
    
    <base href="/" />
    
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <link rel="manifest" href="/manifest.json" />
    
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    
    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ionic App" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
